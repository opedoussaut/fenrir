; FENRIR firmware — PlatformIO project.
; The portable core (src/core) is covered by host tests (firmware/tests).
; The ESP32 platform layer (src/platform/esp32) has NOT run on hardware yet;
; see docs/verification/verification-matrix.md.

[platformio]
src_dir = src
include_dir = include
default_envs = fenrir_pcb

[env]
; pioarduino fork: Arduino-ESP32 core 3.x, required for the ESP32-C6.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
; Pinned 2026-11-17: the "stable" URL moved to a release that needs a newer PlatformIO Core.
; 55.03.312 is the release that built this firmware on 2026-11-16 (PlatformIO removed it when "stable" moved).
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -Wall -Wextra
    -DFENRIR_FW_VERSION=\"0.1.0\"
build_src_filter = +<core/> +<platform/esp32/>

; FENRIR is one product (decision D-023): the FENRIR PCB with an ESP32-C6-MINI-1
; module (4 MB flash) and a TI ADS1220 on SPI (D-024). The Espressif
; ESP32-C6-DevKitM-1 board definition uses the same module. The pin map in
; src/platform/esp32/main.cpp is provisional until the schematic exists.
; The Adafruit Feather (proto-A) and ESP32-C3 targets were removed with the
; modular prototype; the NAU7802 driver stays in src/core, host-tested only.
[env:fenrir_pcb]
board = esp32-c6-devkitm-1
build_flags =
    ${env.build_flags}
    -DFENRIR_HW_REV=\"pcb-A-draft\"
    -DFENRIR_HAS_MAX17048=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
