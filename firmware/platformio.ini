; FENRIR firmware — PlatformIO project.
; The portable core (src/core) is covered by host tests (firmware/tests).
; The ESP32 platform layer (src/platform/esp32) has NOT run on hardware yet;
; see docs/verification/verification-matrix.md.

[platformio]
src_dir = src
include_dir = include
default_envs = feather_esp32c6

[env]
; pioarduino fork: Arduino-ESP32 core 3.x, required for the ESP32-C6.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -Wall -Wextra
    -DFENRIR_FW_VERSION=\"0.1.0\"
build_src_filter = +<core/> +<platform/esp32/>

; Phase 2 modular prototype: Adafruit ESP32-C6 Feather (PID 5933) +
; Adafruit NAU7802 breakout (PID 4538) on the STEMMA QT connector.
[env:feather_esp32c6]
board = adafruit_feather_esp32c6
build_flags =
    ${env.build_flags}
    -DFENRIR_HW_REV=\"proto-A\"
    -DFENRIR_HAS_MAX17048=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Phase 3 custom PCB candidate (ESP32-C3-MINI-1). Pin map is provisional until
; the schematic exists.
[env:pcb_esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DFENRIR_HW_REV=\"pcb-draft\"
    -DFENRIR_HAS_MAX17048=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
