[project]
name = "fenrir-tools"
version = "0.1.0"
description = "Host tools for the FENRIR open-source climbing dynamometer"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["software"]
include = ["fenrir*"]

[tool.pytest.ini_options]
pythonpath = ["software"]
testpaths = ["tests"]
